<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Generator</title>
    <style>
        .border { border: 1px solid #ccc; }
        .rounded-r { border-radius: 5px; }
        #editor { padding: 10px; }
    </style>
</head>
<body>
    <div id="editor" class="border rounded-r"></div>
    <textarea id="prompt" rows="4" cols="50"></textarea>
    <button id="generate">Generate</button>

    <script>
        document.getElementById('generate').addEventListener('click', function() {
            const userInput = document.getElementById('prompt').value;

            fetch('https://api.your-gemini-api-endpoint.com/generate-md', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer '
                },
                body: JSON.stringify({ prompt: userInput })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('editor').innerHTML = data.markdownText;
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
